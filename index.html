<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>The Ashen Arena</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--ink:#f2e9dc;--muted:#a89c8d;--ember:#ef6848;--gold:#d8b27a;--panel:rgba(17,17,17,.84)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100f0e;color:var(--ink);font-family:'DM Sans',sans-serif}canvas{display:block;width:100vw;height:100vh;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;display:none}.topline{position:absolute;top:24px;left:50%;transform:translateX(-50%);width:min(650px,70vw);text-align:center}.boss-name{font:600 13px Cinzel,serif;letter-spacing:.28em;color:#d9cbbb;text-transform:uppercase;text-shadow:0 2px 6px #000}.health-track{height:11px;margin-top:12px;background:#1a1412;border:1px solid #6c4a3c;box-shadow:0 0 20px #0008;position:relative;overflow:hidden}.health-fill{height:100%;width:100%;background:linear-gradient(90deg,#7d2920,#e35436,#ff9b5b);transition:width .18s;box-shadow:0 0 14px #e75a3d}.hp-label{font-size:10px;letter-spacing:.15em;color:#d4c7b6;margin-top:6px}.top-right{position:absolute;right:28px;top:25px;text-align:right;font-size:11px;letter-spacing:.12em;color:#c5b7a5}.phase-label{color:#ef7957;margin-top:6px;font:12px Cinzel,serif;letter-spacing:.15em}.player-card{position:absolute;left:28px;bottom:28px;width:210px;padding:13px 15px;background:linear-gradient(100deg,#181411df,#1814119c);border-left:2px solid #c46041;box-shadow:0 8px 26px #0005}.player-name{font:600 12px Cinzel,serif;letter-spacing:.12em}.player-rank{color:#d2a872;font-size:10px;letter-spacing:.14em;margin-top:3px}.player-health{height:5px;background:#392c28;margin-top:10px}.player-health i{display:block;height:100%;background:#c64f3e;transition:width .2s}.health-text{font-size:10px;color:#c9b9a7;margin-top:4px;display:flex;justify-content:space-between}.hud-stats{position:absolute;left:28px;top:27px;color:#b9ac9d;font-size:10px;letter-spacing:.1em;line-height:1.9}.hud-stats b{color:#f0dfc8;font-weight:600}.controls{position:absolute;right:28px;bottom:27px;display:flex;align-items:end;gap:8px}.keycap{border:1px solid #8a77625c;background:#171410c9;color:#dbcab3;padding:8px 11px;font-size:10px;letter-spacing:.08em}.keycap strong{font:600 10px Cinzel,serif;color:#fff}.cooldown{position:absolute;right:28px;bottom:72px;color:#c8b9a8;font-size:10px;letter-spacing:.1em;text-align:right}.cooldown span{color:#eb9470}.toast{position:absolute;top:105px;left:50%;transform:translateX(-50%);font:13px Cinzel,serif;letter-spacing:.12em;color:#ffc17d;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .2s}.toast.on{opacity:1}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(17,14,12,.42),rgba(7,7,7,.82));}.panel{width:min(590px,90vw);padding:40px 48px;text-align:center;border:1px solid #a87b5150;background:linear-gradient(145deg,#191612f2,#100e0df5);box-shadow:0 25px 100px #000b;position:relative}.panel:before,.panel:after{content:'';position:absolute;width:30px;height:30px;border-color:#bd8556;border-style:solid;opacity:.75}.panel:before{top:12px;left:12px;border-width:1px 0 0 1px}.panel:after{bottom:12px;right:12px;border-width:0 1px 1px 0}.eyebrow{font-size:10px;letter-spacing:.35em;color:#c88a5d;text-transform:uppercase;margin-bottom:17px}.title{font:600 clamp(38px,7vw,64px)/.95 Cinzel,serif;letter-spacing:.04em;margin:0;color:#f3e8d8;text-shadow:0 4px 24px #d4512933}.subtitle{font:14px Cinzel,serif;letter-spacing:.25em;color:#bd7755;margin-top:12px}.description{max-width:420px;margin:24px auto;color:#b6a99a;font-size:13px;line-height:1.8}.button{pointer-events:auto;border:1px solid #c88958;background:linear-gradient(180deg,#9e4c34,#6c2f25);color:#fff1df;padding:14px 30px;font:600 12px Cinzel,serif;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;box-shadow:0 7px 25px #0007;transition:filter .15s,transform .15s}.button:hover{filter:brightness(1.2);transform:translateY(-1px)}.secondary{background:transparent;border-color:#786653;margin-left:8px;color:#cbbb9f}.rank-line{font:13px Cinzel,serif;color:#d5b681;margin:14px}.small{font-size:10px;line-height:1.7;color:#81776d;margin-top:20px;letter-spacing:.05em}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:23px 0}.result-grid div{padding:10px;background:#ffffff08;border:1px solid #ffffff0c}.result-grid b{display:block;font:17px Cinzel,serif;color:#f0d1a3}.result-grid span{font-size:9px;letter-spacing:.12em;color:#998e80}.touch{display:none;pointer-events:none;position:absolute;inset:0}.stick{pointer-events:auto;position:absolute;bottom:36px;left:30px;width:118px;height:118px;border-radius:50%;border:1px solid #d6c6ad55;background:#1714107c;touch-action:none}.nub{position:absolute;width:42px;height:42px;border-radius:50%;left:37px;top:37px;background:#b8a48b77;border:1px solid #eddbc888}.touch-btn{pointer-events:auto;position:absolute;bottom:49px;right:30px;width:66px;height:66px;border-radius:50%;border:1px solid #d67b58;background:#672e25a8;color:#f6d8bb;font:10px Cinzel,serif;letter-spacing:.08em;touch-action:none}.touch-btn.dodge{right:107px;bottom:34px;width:52px;height:52px;border-color:#b5945d;background:#534321a8;font-size:9px}
@media(max-width:700px){.topline{top:15px;width:66vw}.top-right{right:12px;top:16px;font-size:9px}.hud-stats{left:12px;top:16px;font-size:9px}.player-card{left:12px;bottom:14px;width:155px;padding:9px}.controls{display:none}.cooldown{right:12px;bottom:15px}.touch{display:block}.panel{padding:32px 22px}.description{font-size:12px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="hud-stats">ASHEN ARENA<br><b id="count">1 / 15</b> WARRIORS<br><b id="elapsed">00:00</b> BATTLE</div>
  <div class="topline"><div class="boss-name">THE CINDER WARDEN</div><div class="health-track"><div class="health-fill" id="bossFill"></div></div><div class="hp-label"><span id="bossHp">50,000</span> / 50,000 · <span id="bossPct">100</span>%</div></div>
  <div class="top-right">LOCAL WARRIOR <span style="color:#d7ad77">●</span><div class="phase-label" id="phase">DORMANT</div></div>
  <div class="player-card"><div class="player-name">ASHEN WARRIOR</div><div class="player-rank" id="rankName">RONIN · RANK I</div><div class="player-health"><i id="playerFill"></i></div><div class="health-text"><span>VITALITY</span><span id="playerHp">100 / 100</span></div></div>
  <div class="cooldown">DODGE <span id="dodgeLabel">READY</span></div>
  <div class="controls"><div class="keycap"><strong>WASD</strong> MOVE</div><div class="keycap"><strong>SPACE</strong> KATANA</div><div class="keycap"><strong>SHIFT</strong> DODGE</div><div class="keycap"><strong>MOUSE</strong> AIM</div></div>
  <div class="toast" id="toast"></div>
</div>
<div id="touch" class="touch"><div class="stick" id="stick"><div class="nub" id="nub"></div></div><button class="touch-btn dodge" id="dodgeBtn">DODGE</button><button class="touch-btn" id="attackBtn">SLASH</button></div>
<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const $=s=>document.querySelector(s), ranks=['RONIN','ASHIGARU','BUSHI','SAMURAI','HATAMOTO','SHOGUN','GOD OF WAR'], thresholds=[0,1,3,6,10,16,24];
let W=0,H=0,dpr=1,cx=0,cy=0,scale=1,arenaR=0,last=0,elapsed=0,state='menu',keys={},pointer={x:0,y:0,down:false},touchVec={x:0,y:0},joystick=null;
let save;try{save=JSON.parse(localStorage.getItem('ashenProfile'))||{};}catch(e){save={}}
save={rank:save.rank||0,wins:save.wins||0,matches:save.matches||0,bosses:save.bosses||0,damage:save.damage||0,deaths:save.deaths||0};
let player,boss,particles=[],embers=[],decos=[],attackFX=[],shake=0,toastTimer=0,ambientTime=0,musicOn=true,audioCtx=null,lastAttack=0;
function persist(){try{localStorage.setItem('ashenProfile',JSON.stringify(save))}catch(e){}}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);cx=W/2;cy=H*.51;arenaR=Math.min(W*.41,H*.42);scale=arenaR/430;}
function syncTouch(){ $('#touch').style.display=state==='playing'&&matchMedia('(max-width:700px)').matches?'block':'none'; }
addEventListener('resize',()=>{resize();syncTouch()});resize();
function profileSkin(){return save.rank||0}
function showToast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');toastTimer=2.2}
function setOverlay(html){$('#panel').innerHTML=html;$('#overlay').style.display='flex'}
function hideOverlay(){$('#overlay').style.display='none'}
function startGame(){
 state='playing';save.matches++;persist();elapsed=0;last=performance.now();boss={x:0,y:-15,r:66,hp:50000,max:50000,phase:0,attack:null,nextAttack:2.1,anim:0,hurt:0,dead:false};
 player={x:Math.random()*40-20,y:145,hp:100,max:100,r:13,dir:Math.PI*1.5,faceX:0,faceY:-1,attack:0,dodge:0,dodgeCd:0,invuln:0,dead:false,damage:0,hits:0,walk:0,flash:0};
 particles=[];embers=[];attackFX=[];shake=0;lastAttack=0;for(let i=0;i<120;i++)particles.push(makeAsh(true));for(let i=0;i<35;i++)embers.push(makeEmber(true));
 $('#hud').style.display='block';hideOverlay();updateHud();
}
function makeAsh(initial){let a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*.97;return{x:Math.cos(a)*arenaR*r,y:Math.sin(a)*arenaR*r,vx:(Math.random()-.5)*8,vy:-5-Math.random()*12,size:.6+Math.random()*1.7,alpha:.09+Math.random()*.2,phase:Math.random()*6.2}}
function makeEmber(initial){let a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*.92;return{x:Math.cos(a)*arenaR*r,y:Math.sin(a)*arenaR*r,vx:(Math.random()-.5)*14,vy:-9-Math.random()*16,size:1+Math.random()*2,life:Math.random()*5,alpha:.4+Math.random()*.6}}
function rankTitle(i=save.rank){return `${ranks[i]} · RANK ${['I','II','III','IV','V','VI','VII'][i]}`}
function updateHud(){if(!boss||!player)return;$('#bossFill').style.width=Math.max(0,boss.hp/boss.max*100)+'%';$('#bossHp').textContent=Math.ceil(boss.hp).toLocaleString();$('#bossPct').textContent=Math.ceil(boss.hp/boss.max*100);$('#playerFill').style.width=Math.max(0,player.hp)+'%';$('#playerHp').textContent=`${Math.ceil(player.hp)} / 100`;$('#rankName').textContent=rankTitle();$('#elapsed').textContent=fmt(elapsed);$('#phase').textContent=['DORMANT','IGNITION','CRACKING','RAGE'][boss.phase]||'RAGE';$('#dodgeLabel').textContent=player.dodgeCd<=0?'READY':player.dodgeCd.toFixed(1)+'s'}
function fmt(t){let m=Math.floor(t/60),s=Math.floor(t%60);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function world(x,y){return{x:cx+x*scale,y:cy+y*scale}}
function beginAttack(){if(state!=='playing'||player.dead)return;const now=performance.now()/1000;if(now-lastAttack<.31)return;lastAttack=now;player.attack=.27;let dir=player.dir;
 if(pointer.active){let p=screenWorld(pointer.x,pointer.y);let dx=p.x-player.x,dy=p.y-player.y;if(Math.hypot(dx,dy)>8){dir=Math.atan2(dy,dx);player.dir=dir;player.faceX=Math.cos(dir);player.faceY=Math.sin(dir)}}
 let reach=112,angle=Math.atan2(boss.y-player.y,boss.x-player.x),dist=Math.hypot(boss.x-player.x,boss.y-player.y);let diff=Math.atan2(Math.sin(angle-dir),Math.cos(angle-dir));
 if(dist<reach+boss.r&&Math.abs(diff)<1.17){boss.hp=Math.max(0,boss.hp-20);boss.hurt=.16;player.damage+=20;player.hits++;save.damage+=20;let p={x:boss.x+Math.cos(angle)*boss.r*.72,y:boss.y+Math.sin(angle)*boss.r*.72};for(let i=0;i<8;i++)spawnParticle(p.x,p.y,'spark');attackFX.push({x:p.x,y:p.y,dir,life:.27,max:.27,type:'hit'});if(boss.hp<=0)endGame(true)}else attackFX.push({x:player.x+Math.cos(dir)*30,y:player.y+Math.sin(dir)*30,dir,life:.22,max:.22,type:'slash'});
 sound('slash');updateHud();}
function screenWorld(x,y){return{x:(x-cx)/scale,y:(y-cy)/scale}}
function dodge(){if(state!=='playing'||player.dead||player.dodgeCd>0)return;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+touchVec.x,dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+touchVec.y;let len=Math.hypot(dx,dy);if(len<.1){dx=Math.cos(player.dir);dy=Math.sin(player.dir)}else{dx/=len;dy/=len}player.dodge={x:dx,y:dy,t:.22};player.dodgeCd=1.5;player.invuln=.48;player.dir=Math.atan2(dy,dx);for(let i=0;i<8;i++)spawnParticle(player.x-dx*8,player.y-dy*8,'dust');sound('dodge')}
function spawnParticle(x,y,type){particles.push({x,y,vx:(Math.random()-.5)*(type==='spark'?150:70),vy:(Math.random()-.5)*(type==='spark'?150:65),life:.25+Math.random()*.45,max:.5,size:1+Math.random()*3,type})}
function bossAttack(){let hp=boss.hp/boss.max,roll=Math.random(),type;if(roll<.25)type='melee';else if(roll<.49)type='wave';else if(roll<.74)type='mark';else if(roll<.9)type='sweep';else type='roar';let delay=type==='melee'?.95:type==='wave'?1.45:type==='mark'?1.4:type==='sweep'?1.2:1.05;
 let tx=player.x,ty=player.y;if(type==='mark'){let a=Math.random()*Math.PI*2,r=Math.random()*135;tx=player.x+Math.cos(a)*r;ty=player.y+Math.sin(a)*r;let d=Math.hypot(tx,ty);if(d>arenaR/scale-65){tx*=.7;ty*=.7}}
 boss.attack={type,t:0,delay,tx,ty,dir:Math.atan2(player.y-boss.y,player.x-boss.x),hit:false};sound(type==='roar'?'roar':'warning');}
function damagePlayer(dmg,x=player.x,y=player.y){if(player.invuln>0||player.dead)return;player.hp=Math.max(0,player.hp-dmg);player.flash=.3;shake=Math.max(shake,7);for(let i=0;i<12;i++)spawnParticle(x,y,'dust');sound('hurt');if(player.hp<=0){player.dead=true;save.deaths++;persist();setTimeout(()=>{if(state==='playing'&&player&&player.dead)endGame(false)},850)}updateHud()}
function resolveBossAttack(a){if(a.hit)return;a.hit=true;let dx=player.x-a.tx,dy=player.y-a.ty,dist=Math.hypot(dx,dy);if(a.type==='melee'&&Math.hypot(player.x-boss.x,player.y-boss.y)<125)damagePlayer(28);else if(a.type==='wave'&&Math.hypot(player.x-boss.x,player.y-boss.y)<250)damagePlayer(22);else if(a.type==='mark'&&dist<55)damagePlayer(38,a.tx,a.ty);else if(a.type==='sweep'){let d=Math.hypot(player.x-boss.x,player.y-boss.y),ang=Math.atan2(player.y-boss.y,player.x-boss.x),dif=Math.atan2(Math.sin(ang-a.dir),Math.cos(ang-a.dir));if(d<205&&Math.abs(dif)<1.12)damagePlayer(32)}else if(a.type==='roar'&&Math.hypot(player.x-boss.x,player.y-boss.y)<195)damagePlayer(18);}
function update(dt){ambientTime+=dt;if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('#toast').classList.remove('on')}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.08,dt);p.vy*=Math.pow(.08,dt);p.life-=dt}particles=particles.filter(p=>p.life>0);for(const p of embers){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0||Math.hypot(p.x,p.y)>arenaR/scale)Object.assign(p,makeEmber())}for(const p of decos){p.age+=dt}
 if(state!=='playing')return;elapsed+=dt;boss.anim+=dt;if(boss.hurt>0)boss.hurt-=dt;if(player.flash>0)player.flash-=dt;if(player.attack>0)player.attack-=dt;if(player.dodgeCd>0)player.dodgeCd-=dt;if(player.invuln>0)player.invuln-=dt;player.walk+=dt*8;
 let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+touchVec.x,dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+touchVec.y;let len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len}if(player.dodge&&player.dodge.t>0){dx=player.dodge.x*3.1;dy=player.dodge.y*3.1;player.dodge.t-=dt}else{dx*=185;dy*=185}if(Math.hypot(dx,dy)>.1){player.x+=dx*dt;player.y+=dy*dt;if(!player.dodge){player.dir=Math.atan2(dy,dx);player.faceX=Math.cos(player.dir);player.faceY=Math.sin(player.dir)}}let bound=arenaR/scale-24,pr=Math.hypot(player.x,player.y);if(pr>bound){player.x=player.x/pr*bound;player.y=player.y/pr*bound}
 if(pointer.active&&!player.dodge){let pt=screenWorld(pointer.x,pointer.y);if(Math.hypot(pt.x-player.x,pt.y-player.y)>20){player.dir=Math.atan2(pt.y-player.y,pt.x-player.x);player.faceX=Math.cos(player.dir);player.faceY=Math.sin(player.dir)}}
 let phase=boss.hp/boss.max<=.25?3:boss.hp/boss.max<=.5?2:boss.hp/boss.max<=.75?1:0;if(phase!==boss.phase){boss.phase=phase;showToast(['THE WARDEN STIRS','THE SEAL IS CRACKING','ITS EMBERS BURN BRIGHTER','RAGE OF THE CINDER KING'][phase]);sound('phase')}
 boss.nextAttack-=dt;if(boss.nextAttack<=0&&!boss.attack){bossAttack();let intervals=[2.5,2.1,1.8,1.48];boss.nextAttack=intervals[boss.phase]+Math.random()*.55}
 if(boss.attack){let a=boss.attack;a.t+=dt;if(a.t>=a.delay&&!a.hit){resolveBossAttack(a);shake=Math.max(shake,a.type==='wave'?9:5);if(a.type==='wave'){for(let i=0;i<32;i++){let an=i*Math.PI/16;spawnParticle(boss.x+Math.cos(an)*65,boss.y+Math.sin(an)*65,'dust')}}sound(a.type==='roar'?'roar':'impact')}if(a.t>a.delay+.55)boss.attack=null}
 for(const a of attackFX)a.life-=dt;attackFX=attackFX.filter(a=>a.life>0);shake=Math.max(0,shake-dt*18);updateHud();if(boss.hp<=0&&state==='playing')endGame(true);
}
function endGame(victory){if(state!=='playing')return;state=victory?'victory':'defeat';$('#hud').style.display='none';if(victory){
let active=player.damage>=1000;if(active){save.wins++;save.bosses++;let old=save.rank;if(save.rank<6&&save.wins>=thresholds[save.rank+1])save.rank++;persist();setOverlay(`<div class="eyebrow">The forest remembers</div><h1 class="title">VICTORY</h1><div class="subtitle">THE CINDER WARDEN HAS FALLEN</div><p class="description">The last embers fade beneath a blood-red dawn. Your name is etched into the old stone.</p><div class="rank-line">${rankTitle(old)} ${old<save.rank?'→ '+rankTitle(save.rank):'· SURVIVED'}</div><div class="result-grid"><div><b>${player.damage.toLocaleString()}</b><span>DAMAGE DEALT</span></div><div><b>${player.hits}</b><span>HITS LANDED</span></div><div><b>${fmt(elapsed)}</b><span>BATTLE TIME</span></div></div><div class="small">${save.rank<6?`${Math.max(0,thresholds[save.rank+1]-save.wins)} SURVIVED VICTORY${thresholds[save.rank+1]-save.wins===1?'':'IES'} TO NEXT RANK`:'MAXIMUM RANK ATTAINED'}</div><button class="button" onclick="window.playAgain()">RETURN TO THE ARENA</button>`)}else{persist();setOverlay(`<div class="eyebrow">The ash settles</div><h1 class="title">VICTORY</h1><div class="subtitle">THE WARDEN HAS FALLEN</div><p class="description">You survived, but the ancient rite demands a warrior who has helped turn the tide. Deal at least 1,000 damage in a battle to claim your rank progression.</p><div class="result-grid"><div><b>${player.damage.toLocaleString()}</b><span>DAMAGE DEALT</span></div><div><b>${player.hits}</b><span>HITS LANDED</span></div><div><b>${fmt(elapsed)}</b><span>BATTLE TIME</span></div></div><button class="button" onclick="window.playAgain()">FIGHT AGAIN</button>`)}}else{persist();setOverlay(`<div class="eyebrow">Ash to ash</div><h1 class="title">DEFEAT</h1><div class="subtitle">THE WARDEN CLAIMS THE ARENA</div><p class="description">Your blade falls silent. The forest will wait for another dawn.</p><div class="result-grid"><div><b>${player.damage.toLocaleString()}</b><span>DAMAGE DEALT</span></div><div><b>${player.hits}</b><span>HITS LANDED</span></div><div><b>${fmt(elapsed)}</b><span>BATTLE TIME</span></div></div><div class="small">NO VICTORY PROGRESSION · RANKS NEVER DECREASE</div><button class="button" onclick="window.playAgain()">RISE AGAIN</button>`)}sound(victory?'victory':'defeat')}

function frame(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt);musicUpdate(dt);if(boss&&state==='menu')boss.anim+=dt;render();requestAnimationFrame(frame)}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(k===' '&&!e.repeat)beginAttack();if(k==='shift'&&!e.repeat)dodge()});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
canvas.addEventListener('pointermove',e=>{pointer.x=e.clientX;pointer.y=e.clientY;pointer.active=true});canvas.addEventListener('pointerdown',e=>{if(state!=='playing')return;pointer.x=e.clientX;pointer.y=e.clientY;pointer.active=true;if(e.button===2)dodge();else beginAttack()});canvas.addEventListener('contextmenu',e=>e.preventDefault());
const stick=$('#stick'),nub=$('#nub');stick.addEventListener('pointerdown',e=>{joystick=e.pointerId;stick.setPointerCapture(joystick);moveStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===joystick)moveStick(e)});stick.addEventListener('pointerup',e=>{if(e.pointerId===joystick){joystick=null;touchVec={x:0,y:0};nub.style.transform='translate(0,0)'}});function moveStick(e){let r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy),max=39;if(d>max){dx=dx/d*max;dy=dy/d*max}touchVec={x:dx/max,y:dy/max};nub.style.transform=`translate(${dx}px,${dy}px)`}
$('#attackBtn').addEventListener('pointerdown',e=>{e.preventDefault();beginAttack()});$('#dodgeBtn').addEventListener('pointerdown',e=>{e.preventDefault();dodge()});
menu();requestAnimationFrame(frame);
})();
</script>
